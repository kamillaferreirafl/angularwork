<div class="container-checkout">
  <h2>Checkout</h2>
  
  <div class="resumo-checkout">
    <p>Resumo do pedido</p>
    <p>Itens no carrinho: <strong>{{ totalItensCheckout() }}</strong></p>
    <h3>Total: R$ {{ valorTotalCheckout().toFixed(2) }}</h3>
  </div>

  <form class="form-checkout" (submit)="finalizarCompra($event)">
    <label>
      Nome
      <input type="text" placeholder="Digite seu nome completo" required>
    </label>

    <label>
      E-mail
      <input type="email" placeholder="seu@email.com" required>
    </label>

    <label>
      Endereço
      <input type="text" placeholder="Rua, número, bairro..." required>
    </label>

    <div class="acoes-checkout">
      <button type="button" class="btn-revisar" (click)="voltarCarrinho()">Revisar carrinho</button>
      <button type="submit" class="btn-finalizar">Finalizar Compra</button>
    </div>
  </form>
</div>
